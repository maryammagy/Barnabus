version: candidate-analytics-policy-v1
prompt_version: deterministic-analytics-templates-v1

authorization_provenance:
  classification: candidate-created-policy-v1
  supplied_authorization_values_treated_as_untrusted: true
  supplied_policy_enforced_directly: false
  note: Site semantics informed this reviewed policy; candidate role names and the service-subset test role are not supplied labels.

# This policy is server-side configuration.  Callers name only their principal;
# they cannot send or widen any of these scopes in a request.
source_contract:
  table: analytics_cases
  columns:
    case_key: VARCHAR
    site: VARCHAR
    service_code: VARCHAR
    referral_date: DATE
    age_band: VARCHAR
    cancellation_proxy: BOOLEAN
    readiness_days: DOUBLE
    total_cost_cad: DOUBLE
  public_columns:
    - site
    - service_code
    - referral_date
    - age_band
    - cancellation_proxy
    - readiness_days
    - total_cost_cad
  categorical_patterns:
    site: "^[A-Z][A-Z0-9_-]{0,31}$"
    service_code: "^[A-Z][A-Z0-9_-]{0,63}$"
    age_band: "^(UNKNOWN|[0-9]{1,3}-[0-9]{1,3}|[0-9]{1,3}\\+)$"

limits:
  max_question_chars: 1000
  max_sql_chars: 20000
  max_rows: 100
  max_columns: 32
  max_result_cell_chars: 2048
  statement_timeout_ms: 1200
  scan_ceiling_rows: 250000
  max_table_scans: 4
  max_concurrent_queries: 8

# These are candidate-authored security-evaluation classifications, not labels
# supplied with questions.csv and not clinical ground truth.
candidate_evaluation:
  version: candidate-auth-eval-v1
  supplied_question_labels_available: false
  cases:
    - case_id: aggregate-count
      question: How many cases are there?
      expected_action: answer
      rationale: Approved aggregate over the physically scoped cases table.
    - case_id: ambiguous-performance
      question: How are we doing?
      expected_action: clarify
      rationale: Metric, time window, and consequence are not specified.
    - case_id: prohibited-notes
      question: Show clinical notes.
      expected_action: refuse
      rationale: Free-text notes are outside every approved analytics schema.
    - case_id: unauthorized-site
      question: Count cases for site B.
      expected_action: refuse
      rationale: Candidate site-A test principal has no site-B rows.
    - case_id: unanswerable-prediction
      question: Which patient will definitely recover?
      expected_action: refuse
      rationale: The approved aggregate schema cannot answer this question.

principals:
  assessment-admin:
    scope_basis: candidate-created-policy-mapping-v1 from supplied A/B site semantics
    sites: [A, B]
    services: ["*"]
    columns:
      - site
      - service_code
      - referral_date
      - age_band
      - cancellation_proxy
      - readiness_days
      - total_cost_cad
    rows:
      referral_date_from: "2025-08-01"
      referral_date_to_exclusive: "2026-08-01"

  site-a-reader:
    scope_basis: candidate-created-policy-mapping-v1 from supplied site semantics
    sites: [A]
    services: ["*"]
    columns:
      - site
      - service_code
      - referral_date
      - age_band
      - cancellation_proxy
      - readiness_days
    rows:
      referral_date_from: "2025-08-01"
      referral_date_to_exclusive: "2026-08-01"

  site-a-card-reader:
    # The supplied authorization artifact does not define service subsets.
    # This least-privilege role is explicitly candidate-created for adversarial
    # verification and must not be represented as a supplied role.
    scope_basis: candidate-created-test-extension-v1
    sites: [A]
    services: [A-CARD]
    columns:
      - site
      - service_code
      - referral_date
      - cancellation_proxy
      - readiness_days
    rows:
      referral_date_from: "2025-08-01"
      referral_date_to_exclusive: "2026-08-01"
