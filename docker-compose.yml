version: '3.8'

services:
  evaluation-service:
    build:
      context: ./evaluation-service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - LOG_LEVEL=INFO
      - PORT=5000
      - ALERT_BUDGET=10
      - ALERT_WINDOW_HOURS=24
      - DRIFT_THRESHOLD=0.1
      - CALIBRATION_THRESHOLD=0.05
      - OUTCOME_THRESHOLD=0.1
      - BASELINE_WINDOW_DAYS=30
      - P99_LATENCY_BUDGET_MS=500
      - STATEMENT_TIMEOUT_MS=15000
    volumes:
      - ./out/candidate:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - LOG_LEVEL=INFO
      - PORT=5001
      - ROW_LIMIT=5000
      - STATEMENT_TIMEOUT_MS=15000
      - MAX_SCAN_ROWS=50000000
      - PROVIDER_TYPE=test
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/analytics.db
    volumes:
      - ./out/candidate:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
